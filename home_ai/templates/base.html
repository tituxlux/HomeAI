<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
  </head>
  <body>
    <header class="navbar navbar-expand-lg bg-primary navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('chatbot.chat') }}">Home AI</a>
        <div class="ms-auto">
          {% if current_user.is_authenticated %}
          <form action="{{ url_for('auth.logout') }}" method="post">
            <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
          </form>
          {% endif %}
        </div>
      </div>
    </header>
    <div class="{% if current_user.is_authenticated %}app-shell{% endif %}">
      {% if current_user.is_authenticated %}
      <aside class="app-sidebar">
        <nav class="nav flex-column">
          <a class="nav-link {% if request.endpoint == 'chatbot.chat' %}active{% endif %}" href="{{ url_for('chatbot.chat') }}">Chatbot</a>
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('manage.') %}active{% endif %}" href="{{ url_for('manage.ingestors') }}">Ingestors</a>
        </nav>
      </aside>
      {% endif %}
      <main class="{% if current_user.is_authenticated %}app-content{% endif %} py-3">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
